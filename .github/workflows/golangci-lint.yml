name: golangci-lint

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs for the same pull request. Other events get a
# unique group so they never cancel each other.
concurrency:
  group: golangci-lint-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: golangci-lint (cachemetrics)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --build-tags=cachemetrics
          skip-cache: true
