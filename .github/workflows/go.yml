name: Go

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs for the same pull request. Other events get a
# unique group so they never cancel each other.
concurrency:
  group: go-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    strategy:
      matrix:
        go-version: ["1.27", "1.26"]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Get dependencies
        run: go get -v -t -d ./...

      - name: Build
        run: go build -v .

      - name: Test
        run: go test -race -v ./...

      - name: Test cache metrics
        if: matrix.platform == 'ubuntu-latest' && matrix.go-version == '1.26'
        run: |
          go test -race -tags cachemetrics -v ./internal/decoder
          go test -tags cachemetrics -run '^$' ./...

  test-386:
    name: Test (Go 1.26, linux/386)
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Test
        env:
          CGO_ENABLED: 0
          GOARCH: "386"
        run: go test -count=1 -v ./...
